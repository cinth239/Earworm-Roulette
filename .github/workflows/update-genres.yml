name: Generate Master Genre Map

on:
  workflow_dispatch: # Allows you to trigger this manually from the GitHub website

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run genre builder script
        run: node build_map.js

      - name: Commit and push generated genre map
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add genre_map.json
          git commit -m "Auto-generate verified master genre_map.json [skip ci]" || echo "No changes to commit"
          git push
